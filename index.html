<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>小智商家短视频生产线｜手机一键成片</title>
  <meta name="description" content="小智商家短视频生产线：手机上传门店照片、视频和文案，自动编排镜头字幕、配乐配音并导出宣传视频。" />
  <meta name="theme-color" content="#07070d" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="小智视频" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />

  <!-- COI SERVICE WORKER -->
  <script>
    (function() {
      const path = location.pathname.replace(/\/[^\/]*$/, '/');
      window.VIZ_BASE_PATH = path.endsWith('/xiaozhi-video-studio/') ? '/xiaozhi-video-studio/' : '/';
    })();
  </script>
  <script src="./coi-serviceworker.js" id="coi-script"></script>
  <script src="./pwa-install.js" defer></script>

  <!--
    GitHub Pages path fix: if this file is served raw from /xiaozhi-video-studio/ instead of the
    built dist/, patch the main module and COI worker to absolute /xiaozhi-video-studio/ paths
    BEFORE the browser requests them. Vite normally rewrites these at build time.
  -->
  <script>
    (function() {
      const base = '/xiaozhi-video-studio/';
      if (location.pathname.startsWith(base)) {
        const main = document.getElementById('main-script');
        const coi = document.getElementById('coi-script');
        if (main) main.src = base + 'src/main.js';
        if (coi) coi.src = base + 'coi-serviceworker.js';
      }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="app-header">
      <div class="app-logo">
        <div class="app-logo-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
        </div>
        <span class="app-logo-text">小智视频</span>
        <span class="app-logo-badge">商家短视频生产线 · 手机优先</span>
      </div>
      <div class="header-center">
        <span class="header-filename" id="header-filename">新建视频项目</span>
        <span class="header-dot active" id="header-dot"></span>
        <span class="header-status" id="header-status">就绪</span>
      </div>
      <div class="header-right">
        <button class="tool-btn" id="btn-new-project" type="button" title="新建项目">新建</button>
        <span class="local-save-status" id="local-save-status">本机保存准备中</span>
        <button class="tool-btn" id="btn-project-library" type="button" title="商家项目管理">项目</button>
        <button class="tool-btn" id="btn-save-project" type="button" title="保存项目">保存</button>
        <button class="tool-btn" id="btn-load-project" type="button" title="打开项目">打开</button>
        <input type="file" id="load-project-input" accept=".json,application/json" style="display:none" aria-hidden="true" tabindex="-1" />
        <button class="tool-btn" id="btn-undo" type="button" title="撤销（Ctrl+Z）">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
          撤销
        </button>
        <button class="tool-btn" id="btn-redo" title="重做（Ctrl+Y）">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          重做
        </button>
      </div>
    </header>

    <!-- Main NLE Workspace -->
    <main class="editor-layout">
      <div class="editor-view">

        <!-- Left: Media Library & Canvas Preview -->
        <div class="editor-main">

          <!-- Add Media Bar -->
          <div class="media-add-bar">
            <span class="media-bar-title">添加素材与图层</span>
            <div class="media-bar-buttons">
              <button class="add-media-btn" id="add-video-btn" type="button">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
                + 视频
              </button>
              <button class="add-media-btn" id="add-image-btn" type="button">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                + 图片
              </button>
              <button class="add-media-btn" id="add-text-btn" type="button">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
                + 文字
              </button>
              <button class="add-media-btn" id="add-audio-btn" type="button">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                + 音频
              </button>
            </div>
          </div>

          <!-- Canvas Preview Panel -->
          <section class="preview-panel">
            <div class="panel-header">
              <div class="panel-header-left">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/></svg>
                <span>画面预览（可选择与调整图层）</span>
              </div>
              <div class="panel-header-right">
                <select class="aspect-ratio-select" id="preview-ratio-select" title="画面比例">
                  <option value="16:9">16:9 横屏</option>
                  <option value="9:16">9:16 竖屏</option>
                  <option value="1:1">1:1 正方形</option>
                  <option value="4:5">4:5 竖版</option>
                  <option value="4:3">4:3 经典</option>
                  <option value="21:9">21:9 超宽屏</option>
                  <option value="custom">自定义</option>
                </select>
                <span class="preview-badge" id="preview-badge">1920×1080</span>
                <span class="preview-time-display" id="preview-time">00:00.00 / 00:00.00</span>
              </div>
            </div>

            <div class="video-wrapper">
              <canvas id="preview-canvas" class="preview-canvas"></canvas>
            </div>
            <p class="preview-touch-hint" aria-live="polite">手机操作：轻点照片选中，再按住照片拖动；选中后可拖动角点调整大小。</p>

            <!-- Transport Bar -->
            <div class="transport-bar">
              <div class="transport-left">
                <button class="transport-btn play-btn" id="ctrl-play" type="button" title="播放/暂停（空格）" aria-label="播放或暂停预览">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" id="ctrl-play-icon" role="img" aria-label="播放图标"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                </button>
                <button class="transport-btn" id="ctrl-stop" type="button" title="停止并重置" aria-label="停止预览">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
                </button>
              </div>

              <div class="transport-center">
                <span class="transport-time" id="ctrl-time">00:00.00</span>
              </div>

              <div class="transport-right">
                <div class="zoom-controls">
                  <button class="mini-btn" id="zoom-out" title="缩小时间线">-</button>
                  <span class="zoom-level" id="zoom-level">100%</span>
                  <button class="mini-btn" id="zoom-in" title="放大时间线">+</button>
                </div>
              </div>
            </div>
          </section>

          <!-- Multi-Track Timeline Panel -->
          <section class="timeline-panel" id="multitimeline-container"></section>
        </div>

        <!-- Right Sidebar: Properties & Export -->
        <div class="editor-sidebar-resizer" id="sidebar-resizer" title="拖动调整面板宽度"></div>
        <aside class="editor-sidebar">
          <!-- Selection Actions Panel -->
          <section class="sidebar-panel">
            <div class="panel-header compact">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
              <span>编辑工具</span>
            </div>
            <div class="tools-grid" style="padding: 8px;">
              <div class="tool-row">
                <button class="tool-btn" id="btn-copy" type="button" title="复制所选内容（Ctrl+C）">复制</button>
                <button class="tool-btn" id="btn-paste" type="button" title="粘贴（Ctrl+V）">粘贴</button>
              </div>
              <div class="tool-row" style="margin-top: 4px;">
                <button class="tool-btn" id="btn-duplicate" type="button" title="创建副本（Ctrl+D）">创建副本</button>
                <button class="tool-btn danger" id="btn-delete" type="button" title="删除所选元素（Del）">删除</button>
              </div>
            </div>
          </section>

          <!-- Properties Panel -->
          <section class="sidebar-panel" id="properties-panel-container"></section>

          <!-- Export Panel -->
          <section class="sidebar-panel export-panel">
            <div class="panel-header compact">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              <span>导出视频（手机稳定优先）</span>
            </div>
            <div class="export-options">
              <div class="export-option-row">
                <label for="export-width">宽度</label>
                <input type="number" id="export-width" value="1920" min="100" max="7680">
              </div>
              <div class="export-option-row">
                <label for="export-height">高度</label>
                <input type="number" id="export-height" value="1080" min="100" max="7680">
              </div>
              <div class="export-option-row">
                <label for="export-fps">帧率</label>
                <select id="export-fps">
                  <option value="24">24</option>
                  <option value="30" selected>30</option>
                  <option value="60">60</option>
                </select>
              </div>
              <div class="export-option-row">
                <label for="export-quality">画质</label>
                <select id="export-quality">
                  <option value="low">低（最快）</option>
                  <option value="medium">中（手机推荐）</option>
                  <option value="high" selected>高</option>
                </select>
              </div>
              <button class="export-btn" id="btn-export" type="button">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                导出视频文件
              </button>
            </div>
          </section>

          <!-- Settings Panel -->
          <section class="sidebar-panel">
            <div class="panel-header compact">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
              <span>编辑设置</span>
            </div>
            <div class="export-options">
              <div class="export-option-row">
                <label for="setting-snap">吸附</label>
                <input type="checkbox" id="setting-snap" checked style="width: auto;">
              </div>
              <div class="export-option-row">
                <label for="setting-proxy">代理预览</label>
                <input type="checkbox" id="setting-proxy" checked style="width: auto;">
              </div>
              <div class="export-option-row">
                <button class="tool-btn wide" id="btn-shortcuts" type="button">快捷键说明（？）</button>
              </div>
            </div>
          </section>
        </aside>

      </div>
    </main>
  </div>

  <!-- Progress Overlay -->
  <div id="progress-overlay" class="progress-overlay">
    <div class="progress-card">
      <div class="progress-spinner" id="progress-spinner">
        <svg width="56" height="56" viewBox="0 0 56 56">
          <circle cx="28" cy="28" r="24" stroke="rgba(139,92,246,0.15)" stroke-width="4" fill="none"/>
          <circle cx="28" cy="28" r="24" stroke="url(#prog-grad)" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="120 151" class="progress-ring"/>
          <defs><linearGradient id="prog-grad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#22d3ee"/></linearGradient></defs>
        </svg>
      </div>
      <h2 class="progress-title" id="progress-title">正在导出视频…</h2>
      <p class="progress-subtitle" id="progress-subtitle">正在渲染多轨道画面</p>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progress-bar" style="width: 0%"></div>
      </div>
      <span class="progress-percent" id="progress-percent">0%</span>
      <button class="progress-cancel-btn" id="progress-cancel-btn" type="button">取消导出</button>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>


  <div class="project-library-backdrop" id="project-library" hidden>
    <section class="project-library-panel" role="dialog" aria-modal="true" aria-labelledby="project-library-title">
      <header class="project-library-header">
        <div>
          <h2 id="project-library-title">商家项目库</h2>
          <p>项目和素材保存在当前手机浏览器中</p>
        </div>
        <button type="button" id="project-library-close" aria-label="关闭">×</button>
      </header>
      <div class="project-library-toolbar">
        <button type="button" id="project-save-copy">＋ 保存为新项目</button>
        <button type="button" id="project-export-bundle">导出完整项目包</button>
        <button type="button" id="project-import-bundle">导入项目包</button>
        <input type="file" id="project-bundle-input" accept=".xzproj,.zip,application/zip" hidden />
        <span>不同商家分别保存，互不覆盖</span>
      </div>
      <div class="project-library-list" id="project-library-list"></div>
      <p class="project-library-footnote">提醒：本机项目库不是云端备份。清除浏览器网站数据或卸载浏览器可能导致项目丢失，请定期导出完整项目包。</p>
    </section>
  </div>

  <script type="module" src="./src/main.js" id="main-script"></script>
  <script>
    // Fallback for when GitHub Pages serves the raw source index.html instead of
    // the built dist/index.html. Vite normally rewrites these paths during build.
    // If the relative module fails, reload with absolute /xiaozhi-video-studio/ paths.
    (function() {
      const base = '/xiaozhi-video-studio/';
      const mainScript = document.getElementById('main-script');
      const coiScript = document.getElementById('coi-script');
      if (location.pathname.startsWith(base) && mainScript) {
        mainScript.addEventListener('error', function() {
          console.warn('[小智视频] Source index.html served under /xiaozhi-video-studio/; retrying with absolute paths.');
          mainScript.src = base + 'src/main.js';
          if (coiScript) coiScript.src = base + 'coi-serviceworker.js';
        });
      }
    })();
  </script>
</body>
</html>
