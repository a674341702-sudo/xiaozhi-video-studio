name: Experimental Chinese TTS WASM build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-matcha-zh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out Xiaozhi Video
        uses: actions/checkout@v4
        with:
          ref: china-mainland-first

      - name: Check out pinned sherpa-onnx source
        uses: actions/checkout@v4
        with:
          repository: k2-fsa/sherpa-onnx
          ref: 4ef1e51d7f177e426bf5e72243604b1249ec315c
          path: sherpa-onnx

      - name: Install Emscripten 4.0.23
        shell: bash
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "${RUNNER_TEMP}/emsdk"
          cd "${RUNNER_TEMP}/emsdk"
          ./emsdk install 4.0.23
          ./emsdk activate 4.0.23
          echo "${RUNNER_TEMP}/emsdk" >> "$GITHUB_PATH"

      - name: Prepare Chinese Matcha model assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sherpa-onnx/wasm/tts/assets
          curl -fL --retry 3 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/matcha-icefall-zh-baker.tar.bz2 \
            -o "${RUNNER_TEMP}/matcha-icefall-zh-baker.tar.bz2"
          echo "ae70096b19c6e283ea351a26b8a718ce6427c8bde8c1da22eb46a5478d39a69b  ${RUNNER_TEMP}/matcha-icefall-zh-baker.tar.bz2" | sha256sum -c -
          tar -xjf "${RUNNER_TEMP}/matcha-icefall-zh-baker.tar.bz2" -C "${RUNNER_TEMP}"
          cp -a "${RUNNER_TEMP}/matcha-icefall-zh-baker/." sherpa-onnx/wasm/tts/assets/
          for asset in model-steps-3.onnx tokens.txt lexicon.txt phone.fst date.fst number.fst; do
            test -s "sherpa-onnx/wasm/tts/assets/$asset" || { echo "Missing Chinese Matcha asset: $asset"; exit 1; }
          done
          curl -fL --retry 3 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/vocoder-models/vocos-22khz-univ.onnx \
            -o sherpa-onnx/wasm/tts/assets/vocos-22khz-univ.onnx
          curl -fL --retry 3 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/vocoder-models/checksum.txt \
            -o "${RUNNER_TEMP}/vocoder-checksum.txt"
          grep -E '[[:space:]]vocos-22khz-univ\.onnx$' "${RUNNER_TEMP}/vocoder-checksum.txt" > "${RUNNER_TEMP}/vocoder-expected.txt"
          test -s "${RUNNER_TEMP}/vocoder-expected.txt"
          (cd sherpa-onnx/wasm/tts/assets && sha256sum -c "${RUNNER_TEMP}/vocoder-expected.txt")
          echo "Model archive SHA-256 verified; vocoder SHA-256 verified against upstream checksum.txt."

      - name: Configure demo for Chinese Matcha
        shell: bash
        run: |
          set -euo pipefail
          cd sherpa-onnx/wasm/tts
          sed -i 's/^let modelType = 0;$/let modelType = 2;/' sherpa-onnx-tts.js
          grep -q '^let modelType = 2;$' sherpa-onnx-tts.js
          # Matcha Chinese uses its bundled lexicon; piper-phonemize is not needed.
          sed -i '/piper-phonemize\/piper-phonemize\.js/d' index.html
          sed -i '/piper-phonemize\/piper-phonemize-wasm-main\.js/d' index.html

      - name: Build sherpa-onnx TTS WebAssembly
        shell: bash
        run: |
          set -euo pipefail
          source "${RUNNER_TEMP}/emsdk/emsdk_env.sh"
          cd sherpa-onnx
          ./build-wasm-simd-tts.sh
          OUT="build-wasm-simd-tts/install/bin/wasm/tts"
          test -s "$OUT/sherpa-onnx-wasm-main-tts.js"
          test -s "$OUT/sherpa-onnx-wasm-main-tts.wasm"
          test -s "$OUT/sherpa-onnx-wasm-main-tts.data"
          test -s "$OUT/sherpa-onnx-tts.worker.js"
          test -s "$OUT/sherpa-onnx-tts.js"
          test -s "$OUT/app-tts.js"
          test -s "$OUT/index.html"
          mkdir -p "${RUNNER_TEMP}/xiaozhi-matcha-zh-wasm"
          cp -a "$OUT/." "${RUNNER_TEMP}/xiaozhi-matcha-zh-wasm/"
          cd "${RUNNER_TEMP}/xiaozhi-matcha-zh-wasm"
          find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          find . -type f -printf '%P\t%s bytes\n' | sort > FILE_SIZES.txt
          cat > BUILD-NOTES.txt <<'EOF'
          EXPERIMENTAL BUILD ONLY - NOT APPROVED FOR PRODUCTION.
          Model: sherpa-onnx Matcha Chinese Baker (modelType=2).
          Upstream source commit: 4ef1e51d7f177e426bf5e72243604b1249ec315c
          Emscripten: 4.0.23
          The workflow downloads source/model files from GitHub Releases.
          This does NOT prove availability on mainland China networks.
          Model commercial license and Android/WeChat performance still require review.
          Do not deploy this artifact to the production Pages site.
          EOF

      - name: Install headless browser for real TTS smoke test
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Generate a real Chinese WAV in headless Chromium
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/xiaozhi-matcha-zh-wasm"
          python3 -m http.server 4179 --bind 127.0.0.1 --directory "$OUT" > "$RUNNER_TEMP/tts-http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4179/index.html >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4179/index.html >/dev/null
          TTS_SMOKE_URL=http://127.0.0.1:4179/ node scripts/smoke-sherpa-tts-browser.mjs

      - name: Upload experimental build artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-matcha-zh-wasm-experiment
          path: ${{ runner.temp }}/xiaozhi-matcha-zh-wasm/
          if-no-files-found: error
          retention-days: 7
