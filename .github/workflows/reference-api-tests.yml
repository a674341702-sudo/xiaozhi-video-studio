name: Reference API tests

on:
  push:
    branches: [main]
    paths:
      - "backend/cloudbase/reference-api/**"
      - ".github/workflows/reference-api-tests.yml"
  pull_request:
    paths:
      - "backend/cloudbase/reference-api/**"
      - ".github/workflows/reference-api-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node.js 20 API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/cloudbase/reference-api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run API tests
        run: npm test
